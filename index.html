<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المساعد العائم السريع</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background: #0f172a; color: #fff; padding: 15px; }
        .card { background: #1e293b; border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid #334155; }
        input, button { width: 100%; padding: 10px; border-radius: 8px; border: none; margin-top: 8px; }
        input { background: #0f172a; color: #fff; border: 1px solid #334155; }
        button { background: #2563eb; color: #fff; font-weight: bold; cursor: pointer; }
        button:active { opacity: 0.8; }
        #chatbox { height: 250px; overflow-y: auto; background: #0f172a; border-radius: 8px; padding: 10px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
        .msg { padding: 8px 12px; border-radius: 8px; max-width: 85%; font-size: 14px; word-break: break-word; }
        .user { background: #2563eb; align-self: flex-start; }
        .bot { background: #334155; align-self: flex-end; }
    </style>
</head>
<body>

    <div class="card">
        <h3>🔑 إعدادات المفتاح</h3>
        <input type="password" id="apiKey" placeholder="أدخل API Key هنا">
        <button onclick="saveKey()">حفظ المفتاح محلياً</button>
    </div>

    <div class="card">
        <div id="chatbox"></div>
        <input type="text" id="userInput" placeholder="اكتب سؤالك السريع..." onkeypress="if(event.key==='Enter') sendMsg()">
        <button onclick="sendMsg()">إرسال سريع ⚡</button>
    </div>

    <script>
        // تحميل المفتاح المحفوظ محلياً
        document.getElementById('apiKey').value = localStorage.getItem('gemini_key') || '';

        function saveKey() {
            const key = document.getElementById('apiKey').value.trim();
            localStorage.setItem('gemini_key', key);
            alert('تم حفظ المفتاح بنجاح وسرية في متصفحك!');
        }

        async function sendMsg() {
            const key = localStorage.getItem('gemini_key') || document.getElementById('apiKey').value.trim();
            const input = document.getElementById('userInput');
            const chatbox = document.getElementById('chatbox');
            const text = input.value.trim();

            if (!text) return;
            if (!key) { alert('يرجى إدخال API Key وحفظه أولاً!'); return; }

            // إظهار رسالة المستخدم
            appendMsg(text, 'user');
            input.value = '';

            // إظهار مؤشر الانتظار
            const botMsgDiv = appendMsg('جاري التفكير...⚡', 'bot');

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }],
                        generationConfig: {
                            maxOutputTokens: 200, // تحديد طول الإجابة لسرعة التوليد
                            temperature: 0.4
                        }
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    botMsgDiv.innerText = data.candidates[0].content.parts[0].text;
                } else {
                    botMsgDiv.innerText = 'حدث خطأ في الرد: ' + (data.error?.message || 'تحقق من المفتاح');
                }
            } catch (err) {
                botMsgDiv.innerText = 'خطأ في الاتصال بالشبكة!';
                console.error(err);
            }
            chatbox.scrollTop = chatbox.scrollHeight;
        }

        function appendMsg(text, sender) {
            const chatbox = document.getElementById('chatbox');
            const div = document.createElement('div');
            div.className = `msg ${sender}`;
            div.innerText = text;
            chatbox.appendChild(div);
            chatbox.scrollTop = chatbox.scrollHeight;
            return div;
        }
    </script>
</body>
</html>
