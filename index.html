<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المساعد العائم السريع (Groq)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background: #0f172a; color: #fff; padding: 15px; }
        .card { background: #1e293b; border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid #334155; }
        input, button { width: 100%; padding: 10px; border-radius: 8px; border: none; margin-top: 8px; }
        input { background: #0f172a; color: #fff; border: 1px solid #334155; }
        button { background: #2563eb; color: #fff; font-weight: bold; cursor: pointer; }
        button:active { opacity: 0.8; }
        #chatbox { height: 250px; overflow-y: auto; background: #0f172a; border-radius: 8px; padding: 10px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
        .msg { padding: 8px 12px; border-radius: 8px; max-width: 85%; font-size: 14px; word-break: break-word; }
        .user { background: #2563eb; align-self: flex-start; }
        .bot { background: #334155; align-self: flex-end; }
    </style>
</head>
<body>

    <div class="card">
        <h3>🔑 إعدادات مفتاح Groq</h3>
        <input type="password" id="apiKey" placeholder="أدخل Groq API Key هنا">
        <button onclick="saveKey()">حفظ المفتاح محلياً</button>
    </div>

    <div class="card">
        <div id="chatbox"></div>
        <input type="text" id="userInput" placeholder="اكتب سؤالك السريع..." onkeypress="if(event.key==='Enter') sendMsg()">
        <button onclick="sendMsg()">إرسال صاروخي ⚡</button>
    </div>

    <script>
        document.getElementById('apiKey').value = localStorage.getItem('groq_key') || '';

        function saveKey() {
            const key = document.getElementById('apiKey').value.trim();
            localStorage.setItem('groq_key', key);
            alert('تم حفظ مفتاح Groq بنجاح وسرية في متصفحك!');
        }

        async function sendMsg() {
            const key = localStorage.getItem('groq_key') || document.getElementById('apiKey').value.trim();
            const input = document.getElementById('userInput');
            const chatbox = document.getElementById('chatbox');
            const text = input.value.trim();

            if (!text) return;
            if (!key) { alert('يرجى إدخال Groq API Key وحفظه أولاً!'); return; }

            appendMsg(text, 'user');
            input.value = '';

            const botMsgDiv = appendMsg('جاري الرد الفوري...⚡', 'bot');

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 10000);

                // استخدام النموذج المحدث والمستقر من Groq
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${key}`
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [
                            { role: "system", content: "أنت مساعد ذكي للألعاب، أجب باختصار وسرعة." },
                            { role: "user", content: text }
                        ],
                        max_tokens: 200,
                        temperature: 0.4
                    }),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);
                const data = await response.json();
                
                if (data.choices && data.choices[0].message && data.choices[0].message.content) {
                    botMsgDiv.innerText = data.choices[0].message.content;
                } else {
                    botMsgDiv.innerText = 'خطأ من الخادم: ' + (data.error?.message || 'تأكد من صحة المفتاح');
                }
            } catch (err) {
                if (err.name === 'AbortError') {
                    botMsgDiv.innerText = '⚠️ انتهت مهلة الاتصال، تحقق من الشبكة.';
                } else {
                    botMsgDiv.innerText = 'خطأ في الاتصال بالشبكة!';
                }
                console.error(err);
            }
            chatbox.scrollTop = chatbox.scrollHeight;
        }

        function appendMsg(text, sender) {
            const chatbox = document.getElementById('chatbox');
            const div = document.createElement('div');
            div.className = `msg ${sender}`;
            div.innerText = text;
            chatbox.appendChild(div);
            chatbox.scrollTop = chatbox.scrollHeight;
            return div;
        }
    </script>
</body>
</html>
