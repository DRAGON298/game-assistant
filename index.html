<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المساعد السريع</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background: #0f172a; color: #fff; padding: 15px; }
        .card { background: #1e293b; border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid #334155; }
        input, button { width: 100%; padding: 12px; border-radius: 8px; border: none; margin-top: 8px; font-size: 15px; }
        input { background: #0f172a; color: #fff; border: 1px solid #334155; }
        button { background: #2563eb; color: #fff; font-weight: bold; cursor: pointer; }
        #chatbox { height: 250px; overflow-y: auto; background: #0f172a; border-radius: 8px; padding: 10px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
        .msg { padding: 8px 12px; border-radius: 8px; max-width: 85%; font-size: 14px; word-break: break-word; }
        .user { background: #2563eb; align-self: flex-start; }
        .bot { background: #334155; align-self: flex-end; }
        label { font-size: 13px; color: #94a3b8; display: block; margin-top: 8px; }
    </style>
</head>
<body>

    <div class="card">
        <h3>🔑 إعدادات المفتاح</h3>
        <label>مفتاح API Key:</label>
        <input type="password" id="apiKey" placeholder="ألصق مفتاح Groq هنا" oninput="localStorage.setItem('g_key', this.value)">
        
        <label>اسم النموذج:</label>
        <input type="text" id="modelName" value="openai/gpt-oss-120b" oninput="localStorage.setItem('g_model', this.value)">
    </div>

    <div class="card">
        <div id="chatbox"></div>
        <input type="text" id="userInput" placeholder="اكتب سؤالك هنا..." onkeypress="if(event.key==='Enter') sendMsg()">
        <button onclick="sendMsg()">إرسال 🚀</button>
    </div>

    <script>
        // تعبئة البيانات تلقائياً من الذاكرة المحفوظة مسبقاً
        if(localStorage.getItem('g_key')) {
            document.getElementById('apiKey').value = localStorage.getItem('g_key');
        }
        if(localStorage.getItem('g_model')) {
            document.getElementById('modelName').value = localStorage.getItem('g_model');
        }

        async function sendMsg() {
            const key = document.getElementById('apiKey').value.trim();
            const model = document.getElementById('modelName').value.trim() || 'openai/gpt-oss-120b';
            const input = document.getElementById('userInput');
            const chatbox = document.getElementById('chatbox');
            const text = input.value.trim();

            if (!text) return;
            if (!key) { 
                alert('يرجى وضع مفتاح API Key في الأعلى أولاً!'); 
                return; 
            }

            // حفظ احتياطي فوري
            localStorage.setItem('g_key', key);
            localStorage.setItem('g_model', model);

            // إضافة رسالة المستخدم للشاشة
            const userDiv = document.createElement('div');
            userDiv.className = 'msg user';
            userDiv.innerText = text;
            chatbox.appendChild(userDiv);
            input.value = '';
            chatbox.scrollTop = chatbox.scrollHeight;

            // رسالة الانتظار
            const botDiv = document.createElement('div');
            botDiv.className = 'msg bot';
            botDiv.innerText = 'جاري الرد... ⚡';
            chatbox.appendChild(botDiv);
            chatbox.scrollTop = chatbox.scrollHeight;

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${key}`
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: [
                            { role: "system", content: "أنت مساعد ذكي للألعاب، أجب باختصار." },
                            { role: "user", content: text }
                        ],
                        max_tokens: 200,
                        temperature: 0.4
                    })
                });

                const data = await response.json();
                
                if (data.choices && data.choices[0].message) {
                    botDiv.innerText = data.choices[0].message.content;
                } else {
                    botDiv.innerText = 'خطأ: ' + (data.error?.message || 'تأكد من صحة المفتاح');
                }
            } catch (err) {
                botDiv.innerText = 'خطأ في الاتصال بالشبكة!';
                console.error(err);
            }
            chatbox.scrollTop = chatbox.scrollHeight;
        }
    </script>
</body>
</html>
